# Source: https://pre-commit.com/#2-add-a-pre-commit-configuration
repos:
-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
    -   id: commitizen
        stages: [commit-msg]
    #-   id: commitizen-branch
    #    args: ["--", "--check", "--", "--message", "$(git log -1 --pretty=%B)"]
    #    exclude: '^fixup!|^squash!'
    #    stages: [pre-push]
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        stages: [pre-commit]
    -   id: end-of-file-fixer
        stages: [pre-commit]
    -   id: trailing-whitespace
        stages: [pre-commit]
    -   id: pretty-format-json
        stages: [pre-commit]
    -   id: check-merge-conflict
        stages: [pre-commit]
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
    -   id: shellcheck
        args: ["-s", "sh"]
        # A named allowlist, deliberately NOT a directory glob. 62 of the 78
        # tracked sh/bash-shebanged scripts in this repo fail `shellcheck -s sh`
        # today, so `^scripts/.*\.sh$` would go red on the next commit that
        # touched any of them -- including scripts/tests/output-lib-fixtures.sh,
        # which has 43 findings of its own. Files join this list once they are
        # clean, one at a time; see issue #270 for the first addition.
        files: >-
          ^(linux/systems/\.local/bin/org\.jcchikikomori\.dotfiles/bin/dotfiles-lib-output|scripts/tests/prompt-gap-fixtures\.sh)$
