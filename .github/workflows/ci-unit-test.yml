name: CI - Unit Test
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      verbose:
        description: "Stream full command output (DOTFILES_VERBOSE=1)"
        type: boolean
        default: false
jobs:
  output-lib-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install output-lib test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck util-linux
      - name: Validate output library syntax
        run: |
          BIN=linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin
          dash -n "$BIN/dotfiles-lib-output"
          bash --posix -n "$BIN/dotfiles-lib-output"
          sh -n "$BIN/dotfiles-lib-output"
          sh -n scripts/tests/output-lib-fixtures.sh
      - name: Run output-lib fixtures (ubuntu)
        env:
          CI: true
        run: |
          sh scripts/tests/output-lib-fixtures.sh

  output-lib-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git for checkout
        run: |
          pacman -Sy --noconfirm git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install output-lib test deps
        run: |
          pacman -Sy --noconfirm shellcheck util-linux
      - name: Validate output library syntax
        run: |
          BIN=linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin
          sh -n "$BIN/dotfiles-lib-output"
          sh -n scripts/tests/output-lib-fixtures.sh
      - name: Run output-lib fixtures (arch)
        env:
          CI: true
        run: |
          sh scripts/tests/output-lib-fixtures.sh

  output-lib-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install git for checkout
        run: |
          dnf install -y git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install output-lib test deps
        run: |
          dnf install -y shellcheck util-linux
      - name: Validate output library syntax
        run: |
          BIN=linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin
          sh -n "$BIN/dotfiles-lib-output"
          sh -n scripts/tests/output-lib-fixtures.sh
      - name: Run output-lib fixtures (fedora)
        env:
          CI: true
        run: |
          sh scripts/tests/output-lib-fixtures.sh

  output-lib-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install output-lib test deps
        run: |
          brew install shellcheck
      - name: Validate output library syntax
        run: |
          BIN=linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin
          sh -n "$BIN/dotfiles-lib-output"
          sh -n scripts/tests/output-lib-fixtures.sh
      - name: Run output-lib fixtures (darwin)
        env:
          CI: true
        run: |
          sh scripts/tests/output-lib-fixtures.sh

  prompt-gap-ubuntu:
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose, not out of laziness. Every empirical claim behind #270
      # -- the measured pty captures, the per-assertion expectations derived from
      # them, the whole red/green matrix -- was taken on starship v1.26.0.
      # Bumping this pin is the deliberate act that triggers ADR-0003's Kill
      # Criteria re-evaluation: has starship since shipped first-prompt
      # suppression upstream, making the local hooks redundant? Do not float this
      # to "latest".
      STARSHIP_VERSION: v1.26.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install prompt-gap test deps
        run: |
          sudo apt-get update
          # ncurses-bin supplies clear(1), util-linux supplies script(1). The
          # fixture fails hard on either being absent rather than skipping.
          sudo apt-get install -y zsh util-linux ncurses-bin
          curl -fsSL https://starship.rs/install.sh | sh -s -- -b "$HOME/.local/bin" -v "$STARSHIP_VERSION" -f
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Record tested versions
        run: |
          starship --version
          zsh --version
          bash --version | head -1
          script --version
      - name: Validate fixture and fragment syntax
        run: |
          sh -n scripts/tests/prompt-gap-fixtures.sh
          dash -n scripts/tests/prompt-gap-fixtures.sh
          # The two fragments are excluded from the POSIX gate above on purpose:
          # neither is POSIX sh, and each is only ever sourced by its own shell.
          zsh -n linux/zsh/.zsh/prompt-gap.zsh
          bash -n linux/bash/.bashrc.d/04-starship
      # The `if:` below is load-bearing -- do not delete it as redundant. This
      # workflow also runs on `push: branches: [master]` and on
      # workflow_dispatch. On a master push this step would diff master against
      # develop, so any legitimate prompt-geometry edit already merged to develop
      # would turn EVERY master push red until master catches up. False reds
      # train people to ignore the guard, which is the same failure mode that
      # keeps AC-008b a manual review item.
      - name: Assert prompt geometry lines untouched (AC-008a)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin develop
          if git diff FETCH_HEAD -- linux/zsh/.zshrc | grep -E '^[+-][^+-]' | grep -E 'PROMPT=|RPROMPT=|ZLE_RPROMPT_INDENT'; then
            echo "AC-008a: this PR adds or removes a prompt-geometry line in linux/zsh/.zshrc." >&2
            echo "Those lines are a hand-maintained copy of 'starship init zsh' output and must stay byte-identical." >&2
            exit 1
          fi
      - name: Run prompt-gap fixtures
        run: |
          sh scripts/tests/prompt-gap-fixtures.sh

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python_method: pyenv
            description: "pyenv (source compilation)"
          - python_method: uv
            description: "uv (pre-built binaries)"
    env:
      SKIP_SETTING_USER: true
      SKIP_INSTALL_PROGLANG: false
      CI: true
      DOTFILES_VERBOSE: ${{ inputs.verbose && '1' || '' }}
      # Pinned so failure logs written by df_run land inside the path the
      # "Upload logs as artifact" step already collects (see #267).
      DOTFILES_LOG_DIR: /tmp/org.jcchikikomori.dotfiles
      PYTHON_INSTALL_METHOD: ${{ matrix.python_method }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup some directories
        run: |
          mkdir -p $HOME/.dotfiles
          mkdir -p $HOME/.local/state/dotstow
          mkdir -p $HOME/.local/bin/org.jcchikikomori.dotfiles/bin
          mkdir -p $HOME/logs
          cp -r $PWD/* $HOME/.dotfiles/
      - name: Getting Started
        # Redirect rather than pipe to tee: the debian job runs in a container
        # where the step shell is `sh -e` (dash), which rejects `set -o
        # pipefail`. Capturing the status explicitly keeps a failing start.sh
        # from being masked, without depending on a non-POSIX shell option.
        run: |
          rc=0
          ./start.sh >/tmp/start-output.txt 2>&1 || rc=$?
          cat /tmp/start-output.txt
          exit "$rc"
      # Regression guard for #260: start.sh drives {distro}/setup.sh and
      # dotfiles-post-setup, and a command that misses df_run streams raw
      # output over the loading screen. Only the audited apt-based jobs are
      # covered; arch/fedora/darwin follow once each is audited (#269).
      - name: Assert start.sh output contract
        run: |
          sh scripts/tests/assert-output-contract.sh /tmp/start-output.txt "start.sh"
      - name: Execute post-setup (vim)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-vim
      - name: Execute post-setup (git)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-git
      - name: Execute post-setup (homebrew)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-homebrew install
      - name: Execute post-setup (neovim)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-neovim install
      - name: Execute post-setup (python)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-python install ${{ matrix.python_method }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.venv/global/bin" >> $GITHUB_PATH
        env:
          PYTHON_INSTALL_METHOD: ${{ matrix.python_method }}
      - name: Execute post-setup (php)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-php install
      - name: Execute post-setup (ruby)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-ruby install
      - name: Execute post-setup (ruby via homebrew, opt-in)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-ruby install
        env:
          RUBY_INSTALL_METHOD: homebrew
      - name: Verify homebrew Ruby builds a native-extension gem
        run: |
          if command -v brew >/dev/null 2>&1; then
            eval "$(brew shellenv)"
          elif [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          elif [ -x "${HOME}/.linuxbrew/bin/brew" ]; then
            eval "$("${HOME}/.linuxbrew/bin/brew" shellenv)"
          else
            echo "brew not found on PATH or known install locations" >&2
            exit 1
          fi
          gem install --no-document msgpack
        env:
          RUBY_INSTALL_METHOD: homebrew
      - name: Execute post-setup (nodejs)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.dotfiles/bin/dotfiles-nodejs install
      - name: Simulate Stowing
        if: always()
        run: |
          sh stowme.sh
      - name: Post-stowing test (Regression)
        if: always()
        run: |
          if ! command -v stow >/dev/null 2>&1; then
            echo "::warning::stow not found on PATH; skipping regression test"
            exit 0
          fi

          for tracked in \
            "$HOME/.dotfiles/linux/python/.pyenv/version" \
            "$HOME/.dotfiles/linux/supermodel/.supermodel/Config/Supermodel.ini"
          do
            if [ ! -f "$tracked" ]; then
              echo "FAIL: tracked source file was deleted by stowme.sh: $tracked"
              exit 1
            fi
          done
          echo "OK: tracked source files survived stowme.sh"

          fake_dotfiles=$(mktemp -d)
          fake_home=$(mktemp -d)
          trap 'rm -rf "$fake_dotfiles" "$fake_home"' EXIT

          mkdir -p "$fake_dotfiles/linux/fakepkg/.subdir"
          printf 'fake-version\n' > "$fake_dotfiles/linux/fakepkg/.subdir/file"

          stow -d "$fake_dotfiles/linux" -t "$fake_home" fakepkg

          if [ ! -L "$fake_home/.subdir" ]; then
            echo "FAIL: expected $fake_home/.subdir to be a directory symlink after stow"
            ls -la "$fake_home"
            exit 1
          fi

          safe_rm_stow_target() {
            target="$1"
            pkg_dir="$2"
            target_dir=$(dirname -- "$target")
            if target_canonical=$(CDPATH= cd -P -- "$target_dir" 2>/dev/null && pwd); then
              target_canonical="$target_canonical/$(basename -- "$target")"
            else
              target_canonical=
            fi
            pkg_canonical=$(CDPATH= cd -P -- "$pkg_dir" 2>/dev/null && pwd) || pkg_canonical=
            if [ -n "$target_canonical" ] && [ -n "$pkg_canonical" ]; then
              case "$target_canonical" in
                "${pkg_canonical}/"*)
                  check_dir="$target_dir"
                  while [ -n "$check_dir" ] && [ "$check_dir" != "/" ]; do
                    if [ -L "$check_dir" ]; then
                      rm -f "$check_dir"
                      return 0
                    fi
                    check_dir=$(dirname -- "$check_dir")
                  done
                  ;;
              esac
            fi
            rm -f "$target"
          }

          safe_rm_stow_target \
            "$fake_home/.subdir/file" \
            "$fake_dotfiles/linux/fakepkg/.subdir"

          if [ ! -f "$fake_dotfiles/linux/fakepkg/.subdir/file" ]; then
            echo "FAIL: safe_rm_stow_target deleted the source file (regression)"
            exit 1
          fi
          echo "OK: fake-package source file preserved by safe_rm_stow_target"
      - name: Execute post-setup (devtools-opencode install)
        run: |
          ./linux/systems/.local/bin/org.jcchikikomori.devtools/bin/devtools-opencode install
      - name: Verify MCP binaries are in PATH
        run: |
          echo "=== Verifying pipx-installed MCP binaries ==="
          for bin in stackoverflow-mcp web-forager mcp-atlassian; do
            if command -v "$bin" > /dev/null 2>&1; then
              echo "  [ok] $bin found at: $(command -v $bin)"
            else
              echo "  [fail] $bin not found in PATH" >&2
              exit 1
            fi
          done
      - name: Generate list from $HOME dir
        if: always()
        run: |
          mkdir -p /tmp/org.jcchikikomori.dotfiles/
          ls -lah $HOME >> /tmp/org.jcchikikomori.dotfiles/userfilelslah.txt
          find $HOME -type d -name ".dotfiles" -prune -o -type d -name ".local" -prune -o -type d -name "bin" -prune -o -type d -name "logs" -prune -o -print > /tmp/org.jcchikikomori.dotfiles/userfilelist.txt
          cat $HOME/.gitconfig >> /tmp/org.jcchikikomori.dotfiles/gitconfig.txt || true
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotfiles-logs-ubuntu-${{ matrix.python_method }}
          path: /tmp/org.jcchikikomori.dotfiles
          retention-days: 30
          compression-level: 9
          include-hidden-files: true
