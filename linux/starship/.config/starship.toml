# Powerline-style prompt, palette matched to tmux-powerline (linux/tmux/.config/tmux-powerline/config.sh):
# bg/text-on-accent #0E1419, accent blue #00BFFF, git green #5FAF87 (xterm colour72), neutral #cccccc.
format = """
$directory\
$git_branch$git_status\
$all\
$cmd_duration\
$line_break\
$character"""

right_format = """$status$time"""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"

[cmd_duration]
min_time = 2000
style = "bg:#cccccc fg:#0E1419 bold"
format = "[ $duration ]($style)"

[time]
disabled = false
style = "bg:#00BFFF fg:#0E1419 bold"
time_format = "%H:%M"
format = "[ $time ]($style)"

[git_commit]
tag_symbol = " tag "

[git_status]
style = "bg:#5FAF87 fg:#0E1419"
format = "([$all_status$ahead_behind ]($style))"
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

[aws]
style = "bg:#FF9900 fg:#0E1419 bold"
format = '[ $symbol($profile )(\($region\)) ]($style)'
symbol = " "

