# Powerline-style prompt, palette matched to tmux-powerline (linux/tmux/.config/tmux-powerline/config.sh):
# bg/text-on-accent #0E1419, accent blue #00BFFF, git green #5FAF87 (xterm colour72), neutral #cccccc.
format = """
$directory\
([](fg:#00BFFF bg:#5FAF87)$git_branch$git_status[](fg:#5FAF87) )${custom.not_git}\
$all\
$cmd_duration\
$line_break\
$character"""

right_format = """$status$time"""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"

[cmd_duration]
min_time = 2000
style = "bg:#cccccc fg:#0E1419 bold"
format = "[](fg:#cccccc)[ $duration ]($style)"

[time]
disabled = false
style = "bg:#00BFFF fg:#0E1419 bold"
time_format = "%H:%M"
format = "[](fg:#00BFFF)[ $time ]($style)"

[git_commit]
tag_symbol = " tag "

[git_status]
style = "bg:#5FAF87 fg:#0E1419"
format = "([$all_status$ahead_behind ]($style))"
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

# Fallback for the directory->git chain arrow when there's no git repo at all --
# Starship format strings can't express "else", so this uses a negated `when`
# to provide the closing arrow only in that case.
[custom.not_git]
command = "true"
when = "! git rev-parse --is-inside-work-tree 2>/dev/null"
format = "[](fg:#00BFFF) "
disabled = false

